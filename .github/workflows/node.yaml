name: Node CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:

jobs:
  lint:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install
        env:
          CI: true
      - name: Build and check types
        run: yarn build
        env:
          CI: true
      - name: Run lint
        run: yarn lint
        env:
          CI: true

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Enable Corepack and install dependencies
        run: |
          corepack enable
          yarn install
        env:
          CI: true
      - name: Run tests
        run: yarn test
        env:
          CI: true
